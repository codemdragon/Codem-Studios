<!DOCTYPE html>
<html>
<head>
    <title>Codem Studios - Login Successful</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding-top: 100px; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-left-color: #00d1ff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h1>Login Successful!</h1>
    <p>Redirecting you back to your Tizen TV...</p>
    <div class="spinner"></div>

    <script>
        // Extract the "code" from the URL
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');

        if (code) {
            // This is the magic part: It triggers the custom link back to your TV
            window.location.href = "codem://oauth?code=" + code;
            
            // Fallback for some browsers
            setTimeout(() => {
                document.body.innerHTML += '<p>If you weren\'t redirected, <a href="codem://oauth?code=' + code + '" style="color: #00d1ff;">click here</a></p>';
            }, 2000);
        } else {
            document.body.innerHTML = "<h1>Error</h1><p>No authorization code found.</p>";
        }
    </script>
</body>
</html>
